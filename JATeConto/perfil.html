<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conta | Perfil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="assets/index_introducao_login_style.css">
    <link rel="stylesheet" href="assets/perfil_style.css">

</head>
<body class="pagina-perfil">
    
    <header>
        <nav class="navbar navbar-expand-lg navbar-light cabecalho-verde-agua">
  <div class="container-fluid">
    <a class="navbar-brand text-white" href="#">Já Te Conto</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active text-white" aria-current="page" href="#">Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="#">Sobre</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="#">Contato</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="#">Serviços</a>
        </li>
      </ul>
      <form class="d-flex">
        <input class="form-control me-2" type="search" placeholder="Pesquisar" aria-label="Search">
        <button class="btn btn-outline-white bg-white text-muted" type="submit">Buscar</button>
      </form>
    </div>
  </div>
</nav>
    </header>

    <main class="tela-perfil">
        
        <section class="caixa-perfil">
            
            <div class="lado-banner">
                
                <section class="foto-perfil">
                    <img src="assets/Placeholder.png" alt="Placeholder.png">
                </section>
                
                <section class="texto-banner">
                    <section class="nome-banner">
                        <div class="dropdown">
                            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                Seu nome
                            </button>
                            <input class="dropdown-menu"
                                maxlength="12"
                                type="text"
                                id="campoTextoNome"
                                placeholder="Como você se chama?"
                                >
                         </div>
                        <h2 id="textoExibidoNome"><b></b></h2>
                </section>

                    <u>endereço@gmail.com</u>
                    <br>

                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <img src="assets/ButtonEmoji1.png" alt="ButtonEmoji1" class="botao-imagem"> Lendo:
                            <b id="textoExibidoLendo"></b>
                        </button>
                        <input class="dropdown-menu"
                            maxlength="22"
                            type="text"
                            id="campoTextoLendo"
                            placeholder="(Livro que te fez chorar)"
                            >
                    </div>
                </section>
                
                <section class="biografia">
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <img src="assets/ButtonEmoji2.png" alt="ButtonEmoji2" class="botao-imagem"> <b>Sobre você</b>
                        </button>
                        <input class="dropdown-menu"
                            maxlength="20"
                            type="text"
                            id="campoTextoBio"
                            placeholder="(Uma frase marcante)"
                            >
                    </div>
                    <b id="textoExibidoBio"></b>
                </section>
            
            </div>

            <div class="lado-conta">
                
                <h5 class="texto-estante"><b>Estatísticas pessoais</b></h5>
                <hr>

                <section class="estatisticas">
                    
                    <section class="estatistica">
                        <h2>12</h2>
                        <b>Lidos</b>
                    </section>

                    <section class="estatistica">
                        <h2>3</h2>
                        <b>Lendo</b>
                    </section>

                    <section class="estatistica">
                        <h2><b>8</b></h2>
                        <b>Quero ler</b>
                    </section>

                </section>
                
                <br>
                <h5 class="texto-estante"><b>Minha estante</b></h5>
                <hr>

                <section class="estatisticas">
                    
                    <button class="categoria">
                        <h2>📕</h2>
                        <b>Lidos</b>
                    </button>

                    <button class="categoria">
                        <h2>📖</h2>
                        <b>Lendo</b>
                    </button>

                    <button class="categoria">
                        <h2>🔖</h2>
                        <b>Quero ler</b>
                    </button>

                </section>
            
            </div>

            <div class="configuracoes">
                <button>
                    <h5>
                        <img src="assets/ButtonEmoji3.png" alt="ButtonEmoji3" class="botao-imagem">
                        Configurações da conta
                    </h5>
                </button>
            </div>
            
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src="assets/js/biografia.js"></script>
</body>
</html>
