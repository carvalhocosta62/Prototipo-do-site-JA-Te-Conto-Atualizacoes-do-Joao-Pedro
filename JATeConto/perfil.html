<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conta | Perfil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="assets/index_introducao_login_style.css">
    <link rel="stylesheet" href="assets/perfil_style.css">

</head>
<body class="pagina-perfil">
    
    <header>
        <nav class="navbar navbar-expand-lg navbar-light cabecalho-verde-agua">
  <div class="container-fluid">
    <a class="navbar-brand text-white" href="#">Já Te Conto</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active text-white" aria-current="page" href="#">Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="#">Sobre</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="#">Contato</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="#">Serviços</a>
        </li>
      </ul>
      <form class="d-flex">
        <input class="form-control me-2" type="search" placeholder="Pesquisar" aria-label="Search">
        <button class="btn btn-outline-white bg-white text-muted" type="submit">Buscar</button>
      </form>
    </div>
  </div>
</nav>
    </header>

    <main class="tela-perfil">
        
        <section class="caixa-perfil">
            
            <div class="lado-banner">
                
                <section class="foto-perfil">
                    <img src="assets/Placeholder.png" alt="Placeholder.png">
                </section>
                
                <section class="texto-banner">
                    <h2><b>Nome da Conta</b></h2>

                    <u>endereço@gmail.com</u>
                    <br>
                    <button>
                        <img src="assets/ButtonEmoji1.png" alt="ButtonEmoji1" class="botao-imagem"> Lendo:
                        <b>Nome do livro</b>
                    </button>
                </section>
                
                <section class="biografia">
                    <button>
                        <img src="assets/ButtonEmoji2.png" alt="ButtonEmoji2" class="botao-imagem">
                    </button>
                    <b>Biografia do usuário</b>
                </section>
            
            </div>

            <div class="lado-conta">
                
                <h5 class="texto-estante"><b>Estatísticas pessoais</b></h5>
                <hr>

                <section class="estatisticas">
                    
                    <section class="estatistica">
                        <h2>12</h2>
                        <b>Lidos</b>
                    </section>

                    <section class="estatistica">
                        <h2>3</h2>
                        <b>Lendo</b>
                    </section>

                    <section class="estatistica">
                        <h2>8</h2>
                        <b>Quero ler</b>
                    </section>

                </section>
                
                <br>
                <h5 class="texto-estante"><b>Minha estante</b></h5>
                <hr>

                <section class="estatisticas">
                    
                    <button class="categoria">
                        <h2>📕</h2>
                        <b>Lidos</b>
                    </button>

                    <button class="categoria">
                        <h2>📖</h2>
                        <b>Lendo</b>
                    </button>

                    <button class="categoria">
                        <h2>🔖</h2>
                        <b>Quero ler</b>
                    </button>

                </section>
            
            </div>

            <div class="configuracoes">
                <button>
                    <h5>
                        <img src="assets/ButtonEmoji3.png" alt="ButtonEmoji3" class="botao-imagem">
                        Configurações da conta
                    </h5>
                </button>
            </div>
            
        </section>

    </main>

</body>
</html>
